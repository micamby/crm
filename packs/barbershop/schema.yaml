# Clients are the standard Contact object (its owner is the client's barber). Appointments are a custom object
# (its owner is the barber who does the cut). Automations and alerts are set up separately: packs can't carry them.
objects:
  - name: barber
    label: Barber
    plural_label: Barbers
    id_prefix: barb
    display_field: name
    description: A barber in the shop. Appointments link to a barber, so the numbers can be split per barber.
    fields:
      - { name: name, type: text, required: true }
      - { name: member_email, label: Sign-in email, type: email, description: "The email this barber signs in to the app with" }
      - name: home_chair
        label: Usual chair
        type: single_select
        values:
          - { key: chair_1, label: Chair 1 }
          - { key: chair_2, label: Chair 2 }
          - { key: chair_3, label: Chair 3 }
          - { key: chair_4, label: Chair 4 }
          - { key: chair_5, label: Chair 5 }
      - { name: active, type: boolean, default: true }
      - { name: squire_calendar_link, label: Squire calendar link, type: text, sensitivity: confidential, description: "The barber's private iCal link from Squire (treat like a password). MICROSPACE reads appointments from it." }
  - name: service
    label: Service
    plural_label: Services
    id_prefix: serv
    display_field: name
    description: What the shop offers, and how long each one takes. Set up once; booking uses the length.
    fields:
      - { name: name, type: text, required: true, unique: true }
      - { name: length_minutes, label: Length (minutes), type: number, required: true, validation: { min: 5, max: 480 } }
      - { name: price, type: currency }
      - { name: active, type: boolean, default: true }
  - name: message_template
    label: Message
    plural_label: Messages
    id_prefix: msgt
    display_field: name
    description: The wording of the texts barbers send with one tap. Words in curly brackets are filled in for each client.
    fields:
      - { name: name, type: text, required: true, unique: true }
      - { name: text, type: long_text, required: true, description: "You can use {first_name}, {barber}, {shop}, {when} (e.g. today at 10:00 AM) and {policy}" }
  - name: barber_service_time
    label: Barber's service time
    plural_label: Barber service times
    id_prefix: bst
    display_field: summary
    description: Optional. A barber's own length for a service, used instead of the shop's length when booking with that barber.
    fields:
      - { name: summary, type: text, description: "e.g. Luis - Skin fade" }
      - { name: barber, type: relation, relation: { to: barber, cardinality: many_to_one }, required: true }
      - { name: service, type: relation, relation: { to: service, cardinality: many_to_one }, required: true }
      - { name: length_minutes, label: Length (minutes), type: number, required: true, validation: { min: 5, max: 480 } }
  - name: appointment
    label: Appointment
    plural_label: Appointments
    id_prefix: appt
    display_field: summary
    owned: true
    description: One visit to the chair.
    fields:
      - { name: summary, type: text, description: "Filled in automatically, e.g. Jay Ruiz - Skin fade" }
      - { name: client, type: relation, relation: { to: contact, cardinality: many_to_one }, required: true }
      - { name: barber, type: relation, relation: { to: barber, cardinality: many_to_one }, required: true }
      - { name: starts_at, label: Date and time, type: datetime, required: true }
      - { name: service_type, label: Service, type: relation, relation: { to: service, cardinality: many_to_one } }
      - { name: length_minutes, label: Length (minutes), type: number, validation: { min: 5, max: 480 } }
      - name: service
        label: Service (old list)
        hidden: true
        type: single_select
        values:
          - { key: haircut, label: Haircut }
          - { key: skin_fade, label: Skin fade }
          - { key: cut_and_beard, label: Cut and beard }
          - { key: beard_trim, label: Beard trim }
          - { key: lineup, label: Line-up }
          - { key: kids_cut, label: Kids cut }
      - name: chair
        type: single_select
        values:
          - { key: chair_1, label: Chair 1 }
          - { key: chair_2, label: Chair 2 }
          - { key: chair_3, label: Chair 3 }
          - { key: chair_4, label: Chair 4 }
          - { key: chair_5, label: Chair 5 }
      - name: status
        type: status
        values:
          - { key: booked, label: Booked }
          - { key: completed, label: Completed }
          - { key: no_show, label: No-show }
          - { key: cancelled, label: Cancelled }
        initial: booked
        transitions: { booked: [completed, no_show, cancelled], completed: [booked], no_show: [booked, completed], cancelled: [booked] }
      - name: booked_via
        label: Booked via
        type: single_select
        values: [{ key: in_shop, label: In the shop }, { key: square, label: Squire online }]
        default: in_shop
      - { name: checked_in_at, label: Checked in, type: datetime, description: "When the client arrived at the shop" }
      - { name: squire_event_id, label: Squire event ID, type: text, unique: true, hidden: true, description: "Links this appointment to its Squire calendar event" }
      - { name: followup_sent_at, label: No-show text sent, type: datetime }
      - { name: visit_notes, label: What we chatted about, type: long_text }
      - { name: rebooked, type: boolean, default: false, description: "Next cut booked before leaving or within 3 days after this visit" }
  - name: contact
    fields:
      - name: return_every
        label: Comes back every
        type: single_select
        values:
          - { key: w2, label: 2 weeks }
          - { key: w3, label: 3 weeks }
          - { key: w4, label: 4 weeks }
          - { key: w5, label: 5 weeks }
          - { key: w6, label: 6 weeks }
          - { key: w8, label: 8 weeks }
          - { key: w10, label: 10 weeks }
          - { key: w12, label: 12 weeks }
      - { name: usual_cut, label: Usual cut, type: text }
      - { name: referred_by, label: Referred by, type: relation, relation: { to: contact, cardinality: many_to_one }, description: "The client who sent them our way" }
      - { name: last_chat, label: Last time we chatted about, type: long_text }
      - { name: last_visit_at, label: Last visit, type: datetime }
      - { name: next_visit_due, label: Next visit due, type: date }
      - { name: next_booked_at, label: Next booking, type: datetime }
      - { name: visit_count, label: Visits, type: number, default: 0 }
      - { name: regular, type: boolean, default: false }
      - { name: overdue, label: Overdue, type: boolean, default: false }
      - { name: reminder_text, label: Reminder message, type: long_text }
      - { name: reminder_sent_at, label: Reminder text sent, type: datetime }
      - { name: nudged_at, label: Reminded again, type: datetime, description: "Last weekly 'still hasn't booked' reminder" }
