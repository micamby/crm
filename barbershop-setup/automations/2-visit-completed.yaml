name: Visit completed - update the client
trigger: { type: event, event: appointment.updated, changed_fields: [status] }
condition: { field: status, op: eq, value: completed }
actions:
  - { id: done, type: find_records, object: appointment, where: { and: [ { field: client, op: eq, value: "{{record.client}}" }, { field: status, op: eq, value: completed } ] }, limit: 200 }
  - { id: c, type: find_records, object: contact, where: { field: id, op: eq, value: "{{record.client}}" }, limit: 1 }
  - type: update_record
    object: contact
    record: "{{record.client}}"
    values: { last_visit_at: "{{record.starts_at}}", visit_count: "{{steps.done.count}}", last_chat: "{{record.visit_notes | default:\"\"}}", overdue: false }
  - { type: update_record, object: contact, record: "{{record.client}}", if: { output: "{{steps.done.count}}", op: gte, value: 3 }, values: { regular: true } }
  - { type: update_record, object: contact, record: "{{record.client}}", if: { output: "{{steps.c.first.return_every}}", op: eq, value: w2 }, values: { next_visit_due: "{{record.starts_at | add_days:14 | date}}" } }
  - { type: update_record, object: contact, record: "{{record.client}}", if: { output: "{{steps.c.first.return_every}}", op: eq, value: w3 }, values: { next_visit_due: "{{record.starts_at | add_days:21 | date}}" } }
  - { type: update_record, object: contact, record: "{{record.client}}", if: { output: "{{steps.c.first.return_every}}", op: eq, value: w4 }, values: { next_visit_due: "{{record.starts_at | add_days:28 | date}}" } }
  - { type: update_record, object: contact, record: "{{record.client}}", if: { output: "{{steps.c.first.return_every}}", op: eq, value: w5 }, values: { next_visit_due: "{{record.starts_at | add_days:35 | date}}" } }
  - { type: update_record, object: contact, record: "{{record.client}}", if: { output: "{{steps.c.first.return_every}}", op: eq, value: w6 }, values: { next_visit_due: "{{record.starts_at | add_days:42 | date}}" } }
  - { type: update_record, object: contact, record: "{{record.client}}", if: { output: "{{steps.c.first.return_every}}", op: eq, value: w8 }, values: { next_visit_due: "{{record.starts_at | add_days:56 | date}}" } }
  - { type: update_record, object: contact, record: "{{record.client}}", if: { output: "{{steps.c.first.return_every}}", op: eq, value: w10 }, values: { next_visit_due: "{{record.starts_at | add_days:70 | date}}" } }
  - { type: update_record, object: contact, record: "{{record.client}}", if: { output: "{{steps.c.first.return_every}}", op: eq, value: w12 }, values: { next_visit_due: "{{record.starts_at | add_days:84 | date}}" } }
