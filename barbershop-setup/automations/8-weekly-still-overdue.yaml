name: Every morning - remind again about clients still not booked a week later
trigger: { type: schedule, daily: { at: "07:15" }, timezone: America/Chicago }
actions:
  - type: for_each
    query:
      object: contact
      where:
        and:
          - { field: overdue, op: eq, value: true }
          - { field: next_visit_due, op: lt, value: "{{today-7d}}" }
          - { or: [ { field: nudged_at, op: is_null, value: true }, { field: nudged_at, op: lt, value: "{{now-7d}}" } ] }
          - { or: [ { field: next_booked_at, op: is_null, value: true }, { field: next_booked_at, op: lt, value: "{{now}}" } ] }
      limit: 200
    steps:
      - { type: update_record, object: contact, record: "{{item.id}}", values: { nudged_at: "{{now}}" } }
