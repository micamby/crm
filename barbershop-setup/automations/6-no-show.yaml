name: No-show - give the barber a call-back task
trigger: { type: event, event: appointment.updated, changed_fields: [status] }
condition: { field: status, op: eq, value: no_show }
actions:
  - { id: c, type: find_records, object: contact, where: { field: id, op: eq, value: "{{record.client}}" }, limit: 1 }
  - type: create_record
    object: task
    values:
      title: "Call {{steps.c.first.first_name}} {{steps.c.first.last_name}} - missed their appointment"
      assignee: "{{steps.c.first.owner | default:\"OWNER_USER_ID\"}}"
      due_at: "{{today+1d}}"
      related_to: ["{{record.client}}", "{{record.id}}"]
