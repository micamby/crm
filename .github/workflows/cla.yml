# CLA check for pull requests. Contributors sign once by commenting on their PR; signatures are
# stored on the cla-signatures branch. This workflow uses pull_request_target so it can comment on
# fork PRs, and it never checks out or runs PR code.
#
# Setup: the action creates the signatures FILE but not the BRANCH. Before the first pull request,
# create a branch named cla-signatures (for example from main) and leave it
# unprotected; otherwise the check fails with "Make sure the branch ... is NOT protected" or a 404.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          # Explicit accounts only: the action turns `*` into an unanchored `.*` regex.
          allowlist: itisALLAN,dependabot[bot],github-actions[bot]
